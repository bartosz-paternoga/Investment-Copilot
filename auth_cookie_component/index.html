<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Authentication cookie</title>
    <script>
      const sendToStreamlit = (type, data = {}) => {
        window.parent.postMessage(
          { isStreamlitMessage: true, type, ...data },
          "*"
        );
      };

      const Streamlit = {
        setComponentReady: () =>
          sendToStreamlit("streamlit:componentReady", { apiVersion: 1 }),
        setComponentValue: (value) =>
          sendToStreamlit("streamlit:setComponentValue", { value }),
        setFrameHeight: (height) =>
          sendToStreamlit("streamlit:setFrameHeight", { height }),
      };

      const PERSISTENT_STORAGE_KEY = "investment_copilot_auth_persistent";
      const TAB_STORAGE_KEY = "investment_copilot_auth_tab";

      const readCookie = (cookieDocument, name) => {
        const prefix = `${encodeURIComponent(name)}=`;
        const entry = cookieDocument.cookie
          .split(";")
          .map((part) => part.trim())
          .find((part) => part.startsWith(prefix));
        if (!entry) return "";
        try {
          return decodeURIComponent(entry.slice(prefix.length));
        } catch (_error) {
          return entry.slice(prefix.length);
        }
      };

      const readStoredSession = (appWindow) => {
        let persistent = "";
        let tab = "";
        try {
          const record = JSON.parse(
            appWindow.localStorage.getItem(PERSISTENT_STORAGE_KEY) || "null"
          );
          if (record && typeof record.token === "string") {
            const expiresAt = Number(record.expiresAt || 0);
            if (!expiresAt || expiresAt > Date.now()) {
              persistent = record.token;
            } else {
              appWindow.localStorage.removeItem(PERSISTENT_STORAGE_KEY);
            }
          }
        } catch (_error) {
          // The session cookie remains a compatibility fallback.
        }
        try {
          tab = appWindow.sessionStorage.getItem(TAB_STORAGE_KEY) || "";
        } catch (_error) {
          // The session cookie remains a compatibility fallback.
        }
        return { persistent, tab };
      };

      let lastCommand = "";
      const render = (event) => {
        if (event.data?.type !== "streamlit:render") return;
        const args = event.data.args || {};
        const command = JSON.stringify(args);
        if (command === lastCommand) return;
        lastCommand = command;

        const name = String(args.cookie_name || "");
        const action = String(args.action || "get");
        const secure = args.secure !== false;
        let value = "";
        let storage = "";
        let errorMessage = "";

        try {
          // Read and write storage on the top-level app origin. Streamlit
          // components run in iframes, so checking only the component's own
          // storage can falsely confirm a token that disappears on reload.
          const appWindow = window.top;
          const cookieDocument = appWindow.document;
          if (appWindow.location.origin !== window.location.origin) {
            throw new Error("Authentication component is not on the app origin");
          }

          if (name && action === "set") {
            const token = String(args.cookie_value || "");
            if (args.expires_at) {
              const expiresAt = new Date(args.expires_at).getTime();
              if (!Number.isFinite(expiresAt) || expiresAt <= Date.now()) {
                throw new Error("Invalid sign-in expiry");
              }
              appWindow.localStorage.setItem(
                PERSISTENT_STORAGE_KEY,
                JSON.stringify({ token, expiresAt })
              );
              try {
                appWindow.sessionStorage.removeItem(TAB_STORAGE_KEY);
              } catch (_error) {
                // Persistent storage remains authoritative for this login.
              }
              storage = "persistent";
            } else {
              appWindow.sessionStorage.setItem(TAB_STORAGE_KEY, token);
              try {
                appWindow.localStorage.removeItem(PERSISTENT_STORAGE_KEY);
              } catch (_error) {
                // The just-written tab token is still usable in this session.
              }
              storage = "tab";
            }

            // Keep a first-party cookie as a compatibility path. The app's
            // session restore does not depend on the cookie reaching the
            // Streamlit websocket request; it reads the verified storage value.
            try {
              const attributes = ["Path=/", "SameSite=Lax"];
              if (secure) attributes.push("Secure");
              if (args.expires_at) {
                attributes.push(`Expires=${new Date(args.expires_at).toUTCString()}`);
              }
              cookieDocument.cookie =
                `${encodeURIComponent(name)}=${encodeURIComponent(token)}; ` +
                attributes.join("; ");
            } catch (_error) {
              // Browser storage is the authoritative session persistence.
            }
            const saved = readStoredSession(appWindow);
            value = storage === "persistent" ? saved.persistent : saved.tab;
            if (value !== token) throw new Error("Browser storage did not confirm the sign-in");
          } else if (name && action === "delete") {
            appWindow.localStorage.removeItem(PERSISTENT_STORAGE_KEY);
            appWindow.sessionStorage.removeItem(TAB_STORAGE_KEY);
            cookieDocument.cookie =
              `${encodeURIComponent(name)}=; Path=/; Max-Age=0; SameSite=Lax` +
              (secure ? "; Secure" : "");
            value = readCookie(cookieDocument, name);
          } else if (name && action === "get") {
            const saved = readStoredSession(appWindow);
            if (saved.persistent) {
              value = saved.persistent;
              storage = "persistent";
            } else if (saved.tab) {
              value = saved.tab;
              storage = "tab";
            } else {
              value = readCookie(cookieDocument, name);
              storage = value ? "cookie" : "";
            }
          }
        } catch (error) {
          errorMessage = String(error && error.message ? error.message : error);
        }
        Streamlit.setComponentValue({
          ready: true,
          value,
          storage,
          error: errorMessage,
        });
        Streamlit.setFrameHeight(0);
      };

      window.addEventListener("message", render);
      Streamlit.setComponentReady();
      Streamlit.setFrameHeight(0);
    </script>
  </head>
  <body></body>
</html>
