name: tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py auth.py database.py portfolio.py advanced_analytics.py performance_engine.py research_analytics.py scripts tests
      - run: python -m unittest discover -s tests -v
        env:
          ETF_APP_LOCAL_DEV_MODE: "1"

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: investment_copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d investment_copilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/investment_copilot_test
      TEST_RESTORE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/investment_copilot_restore_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Install PostgreSQL driver
        run: python -m pip install --upgrade "psycopg[binary,pool]>=3.2,<4"
      - name: Create the empty recovery-test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE investment_copilot_restore_test'
      - name: Run tenant-pool and backup-restore integration tests
        run: python -m unittest discover -s tests -p 'test_postgres_integration.py' -v
