name: tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py auth.py database.py portfolio.py advanced_analytics.py performance_engine.py research_analytics.py scripts tests
      - run: python -m unittest discover -s tests -v
        env:
          ETF_APP_LOCAL_DEV_MODE: "1"
